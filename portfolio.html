        const RevealOnScroll = ({ children, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, { threshold: 0.1 });

                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={ref} className={`transition-all duration-1000 transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${className}`}>
                    {children}
                </div>
            );
        };

        // --- Interactive Particle Background with Mouse Effect ---
        const ParticleBackground = () => {
            const canvasRef = useRef(null);
            const mouseRef = useRef({ x: null, y: null });

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resizeCanvas = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                // Mouse interaction
                const handleMouseMove = (e) => {
                    mouseRef.current.x = e.clientX;
                    mouseRef.current.y = e.clientY;
                };
                window.addEventListener('mousemove', handleMouseMove);

                const particles = [];
                const particleCount = 100;

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.5;
                        this.vy = (Math.random() - 0.5) * 0.5;
                        this.size = Math.random() * 2 + 1;
                        this.baseX = this.x;
                        this.baseY = this.y;
                        this.density = (Math.random() * 30) + 1;
                    }

                    update() {
                        // Standard Movement
                        this.x += this.vx;
                        this.y += this.vy;

                        // Mouse Interaction (Constellation Effect)
                        if (mouseRef.current.x != null) {
                            let dx = mouseRef.current.x - this.x;
                            let dy = mouseRef.current.y - this.y;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            const forceDirectionX = dx / distance;
                            const forceDirectionY = dy / distance;
                            const maxDistance = 150;
                            const force = (maxDistance - distance) / maxDistance;
                            
                            if (distance < maxDistance) {
                                // Subtle repulsion for organic feel
                                const directionX = forceDirectionX * force * this.density * 0.6;
                                const directionY = forceDirectionY * force * this.density * 0.6;
                                this.x -= directionX;
                                this.y -= directionY;
                            } else {
                                // Return to original velocity
                                if (this.x !== this.baseX) {
                                    let dx = this.x - this.baseX;
                                    this.x -= dx/100; // slowly return
                                }
                                if (this.y !== this.baseY) {
                                    let dy = this.y - this.baseY;
                                    this.y -= dy/100;
                                }
                            }
                        }

                        // Bounce off edges
                        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                    }

                    draw() {
                        ctx.fillStyle = '#00bcd4';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw connections
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < 120) {
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(0, 188, 212, ${1 - distance/120})`;
                                ctx.lineWidth = 0.5;
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });

                    animationFrameId = requestAnimationFrame(animate);
                };

                animate();

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    window.removeEventListener('mousemove', handleMouseMove);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute top-0 left-0 w-full h-full opacity-30 pointer-events-none" />;
        };

        const AnimatedCounter = ({ end, duration = 2000, suffix = "" }) => {
            const [count, setCount] = useState(0);
            const ref = useRef(null);
            const [hasStarted, setHasStarted] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting && !hasStarted) {
                        setHasStarted(true);
                    }
                });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [hasStarted]);

            useEffect(() => {
                if (!hasStarted) return;
                let start = 0;
                const increment = end / (duration / 16);
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= end) {
                        setCount(end);
                        clearInterval(timer);
                    } else {
                        setCount(Math.ceil(start));
                    }
                }, 16);
                return () => clearInterval(timer);
            }, [hasStarted, end, duration]);

            return <span ref={ref}>{count.toLocaleString()}{suffix}</span>;
        };

        const MiniChart = ({ type, data, label, color }) => {

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(ctx, {
                    type: type,
                    data: {
                        labels: data.map((_, i) => `D${i+1}`),
                        datasets: [{
                            label: label,
                            data: data,
                            borderColor: color,
                            backgroundColor: color + '40',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0
                        }]

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { display: false }, y: { display: false } },
                        animation: { duration: 1500 }
                    }
                });
                return () => {
                    if (chartRef.current) chartRef.current.destroy();
                };
            }, [type, data, label, color]);

            return <div className="h-20 w-full mt-2"><canvas ref={canvasRef}></canvas></div>;

                                <RevealOnScroll key={idx} className="glass-card p-6 rounded-xl hover:transform hover:-translate-y-2 transition duration-300 border-t-4 border-teal-400">
                                    <div className="w-12 h-12 bg-navy-800 rounded-full flex items-center justify-center text-teal-400 text-xl mb-4 shadow-lg shadow-teal-900/50">
                                        <i className={`fas ${item.icon}`}></i>
                                    </div>
                                    <h3 className="text-lg font-bold text-white mb-2">{item.title}</h3>
                                    <p className="text-gray-400 text-sm mb-4 leading-relaxed">{item.desc}</p>
                                    <div className="bg-navy-950/50 p-2 rounded text-center border border-white/5">
                                        <p className="text-xs text-orange-400 font-bold uppercase">{item.metric}</p>
                                    </div>
                                </RevealOnScroll>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Skills = () => {
            const chartRef = useRef(null);
            
            useEffect(() => {
                const ctx = chartRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: PORTFOLIO_DATA.skills.radar.labels,
                        datasets: [{
                            label: 'Proficiency',
                            data: PORTFOLIO_DATA.skills.radar.data,
                            backgroundColor: 'rgba(0, 188, 212, 0.2)',
                            borderColor: '#00bcd4',
                            pointBackgroundColor: '#ff6b35',
                            pointBorderColor: '#fff',
                            borderWidth: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            r: {
                                angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                pointLabels: { color: '#94a3b8', font: { size: 12 } },
                                ticks: { display: false, max: 100, backdropColor: 'transparent' }
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
                return () => chart.destroy();
            }, []);

            return (
                <section id="skills" className="py-20 bg-navy-950 text-white">
                    <div className="container mx-auto px-6">
                        <div className="flex flex-col lg:flex-row gap-16 items-center">
                            <div className="w-full lg:w-3/5">
                                <h2 className="text-3xl font-bold mb-6 flex items-center gap-3">
                                    <span className="w-10 h-1 bg-orange-500 rounded-full"></span>
                                    Technical Expertise
                                </h2>
                                <p className="text-gray-400 mb-10 leading-relaxed">
                                    My toolkit is designed for end-to-end data solutions. From extracting raw data using SQL to visualizing actionable insights in Power BI and optimizing workflows with Agile methodologies.
                                </p>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {PORTFOLIO_DATA.skills.categories.map((cat, idx) => (
                                        <RevealOnScroll key={idx} className="glass-card p-6 rounded-xl hover-glow transition duration-300">
                                            <div className="flex items-center mb-4 text-teal-400">
                                                <i className={`fas ${cat.icon} text-xl mr-3`}></i>
                                                <h3 className="font-bold text-lg text-white">{cat.title}</h3>
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                {cat.skills.map((skill, sIdx) => (
                                                    <span key={sIdx} className="px-3 py-1 bg-navy-900 border border-navy-700 rounded text-xs text-gray-300">
                                                        {skill}
                                                    </span>
                                                ))}
                                            </div>
                                        </RevealOnScroll>
                                    ))}
                                </div>
                            </div>

                            <div className="w-full lg:w-2/5">
                                <RevealOnScroll className="bg-navy-900/50 p-6 rounded-2xl border border-white/5 relative">
                                    <div className="absolute top-0 right-0 p-4 opacity-20">
                                        <i className="fas fa-crosshairs text-6xl text-white"></i>
                                    </div>
                                    <canvas ref={chartRef} />
                                </RevealOnScroll>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Experience = () => {
            return (
                <section id="experience" className="py-20 bg-navy-900">
                    <div className="container mx-auto px-6">
                        <h2 className="text-3xl font-bold text-white mb-12 text-center">Professional Journey</h2>

                        <div className="max-w-4xl mx-auto space-y-8">
                            {PORTFOLIO_DATA.experience.map((job, index) => (
                                <RevealOnScroll key={job.id} className="relative pl-8 md:pl-0">
                                    <div className="hidden md:block absolute left-1/2 top-0 bottom-0 w-px bg-gray-700 transform -translate-x-1/2"></div>
                                    <div className={`md:flex items-center justify-between ${index % 2 === 0 ? 'flex-row' : 'flex-row-reverse'}`}>
                                        <div className={`hidden md:block w-5/12 ${index % 2 === 0 ? 'text-right pr-8' : 'text-left pl-8'}`}>
                                            <span className="text-teal-400 font-bold font-mono">{job.period}</span>
                                        </div>
                                        <div className="absolute left-0 md:left-1/2 w-8 h-8 rounded-full bg-navy-800 border-4 border-teal-500 z-10 flex items-center justify-center transform -translate-x-1/2 md:translate-x-[-50%]">
                                            <i className={`fas ${job.icon} text-[10px] text-white`}></i>
                                        </div>
                                        <div className="w-full md:w-5/12 glass-card p-6 rounded-xl border border-white/5 hover:border-teal-500/30 transition-colors">
                                            <div className="md:hidden text-teal-400 text-xs font-bold mb-2 font-mono">{job.period}</div>
                                            <h3 className="text-xl font-bold text-white">{job.role}</h3>
                                            <h4 className="text-gray-400 text-sm mb-4">@ {job.company}</h4>
                                            
                                            <ul className="text-gray-300 text-sm space-y-2 mb-4">
                                                {job.points.slice(0, 3).map((pt, i) => (
                                                    <li key={i} className="flex items-start">
                                                        <span className="text-orange-500 mr-2">▹</span>
                                                        {pt}
                                                    </li>
                                                ))}
                                            </ul>
                                            <div className="flex flex-wrap gap-2 mt-4 pt-4 border-t border-white/5">
                                                {job.badges.map((b, i) => (
                                                    <span key={i} className="text-xs bg-teal-500/10 text-teal-400 px-2 py-1 rounded">
                                                        {b}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </RevealOnScroll>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Projects = () => {
            return (
                <section id="projects" className="py-24 bg-navy-950">
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-16">
                            <h2 className="text-3xl font-bold text-white">Featured Projects</h2>
                            <p className="text-gray-400 mt-2">Solving business problems through analytics</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {PORTFOLIO_DATA.projects.map((project, idx) => (
                                <RevealOnScroll key={idx} className="group glass-card rounded-2xl overflow-hidden hover:transform hover:-translate-y-2 transition-all duration-300 flex flex-col">
                                    <div className="p-5 flex-grow">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="p-2 bg-navy-800 rounded-lg text-teal-400 text-sm">
                                                <i className="fas fa-database"></i>
                                            </div>
                                        </div>
                                        
                                        <h3 className="text-lg font-bold text-white mb-1 truncate" title={project.title}>{project.title}</h3>
                                        <p className="text-xs font-mono text-orange-400 mb-2 truncate">{project.tech}</p>
                                        <p className="text-gray-400 text-xs mb-3 h-8 line-clamp-2 leading-relaxed">{project.desc}</p>
                                        
                                        {/* Live Mini Chart */}
                                        <div className="bg-navy-900/50 p-2 rounded-lg border border-white/5">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-[9px] text-gray-500 uppercase font-bold">Metric</span>
                                                <span className="text-[9px] text-green-400 font-bold">{project.impact}</span>
                                            </div>
                                            <MiniChart 
                                                type={project.chartType} 
                                                data={project.chartData} 
                                                label={project.chartLabel}
                                                color={idx % 2 === 0 ? '#00bcd4' : '#ff6b35'}
                                            />
                                        </div>
                                    </div>
                                    <div className="px-5 py-3 bg-navy-900 border-t border-white/5 flex items-center justify-between text-xs">
                                        <span className="text-gray-400">View Analysis</span>
                                        <a href="#" className="text-teal-400 hover:text-white transition"><i className="fas fa-external-link-alt"></i></a>
                                    </div>
                                </RevealOnScroll>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Certifications = () => {
            return (
                <section id="certifications" className="py-20 bg-navy-900">
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-16">
                            <h2 className="text-3xl font-bold text-white">Certifications & Credentials</h2>
                        </div>
                        <div className="flex flex-wrap justify-center gap-6">
                            {PORTFOLIO_DATA.certifications.map((cert, idx) => (
                                <RevealOnScroll key={idx} className="glass-card px-6 py-4 rounded-full flex items-center gap-4 hover:bg-white/5 transition cursor-pointer group">
                                    <div className="w-10 h-10 rounded-full bg-navy-950 flex items-center justify-center text-teal-400 group-hover:text-orange-500 transition">
                                        <i className={`${cert.icon} text-lg`}></i>
                                    </div>
                                    <div>
                                        <h4 className="text-white font-bold text-sm">{cert.name}</h4>
                                        <p className="text-gray-400 text-xs">{cert.issuer}</p>
                                    </div>
                                    <i className="fas fa-check-circle text-green-500 text-sm ml-2 opacity-0 group-hover:opacity-100 transition"></i>
                                </RevealOnScroll>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="py-24 bg-gradient-to-b from-navy-900 to-navy-950">
                    <div className="container mx-auto px-6">
                        <div className="max-w-4xl mx-auto glass-card rounded-2xl p-8 md:p-12 text-center border border-teal-500/20">
                            <h2 className="text-3xl font-bold text-white mb-6">Ready to maximize your data's potential?</h2>
                            <p className="text-gray-400 mb-8 max-w-xl mx-auto">
                                Whether you have a question or just want to say hi, I'll try my best to get back to you!
                            </p>
                            <a href={`mailto:${PORTFOLIO_DATA.personal.email}`} className="inline-block bg-teal-500 hover:bg-teal-400 text-navy-900 font-bold py-4 px-10 rounded-lg transition transform hover:scale-105 shadow-lg shadow-teal-500/20">
                                Say Hello
                            </a>
                            
                            <div className="flex justify-center gap-6 mt-12">
                                <a href="#" className="text-gray-400 hover:text-white text-2xl transition"><i className="fab fa-linkedin"></i></a>
                                <a href="#" className="text-gray-400 hover:text-white text-2xl transition"><i className="fab fa-github"></i></a>
                            </div>
                            <p className="text-gray-600 text-sm mt-8">
                                &copy; 2025 Sanskar Sharma. Built with React & Tailwind.
                            </p>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            return (
                <div className="antialiased">
                    <Navbar />
                    <Hero />
                    <ValueProposition />
                    <Skills />
                    <Experience />
                    <Projects />
                    <Certifications />
                    <Contact />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
